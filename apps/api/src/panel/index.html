<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Panel del servidor · EConsultor</title>
<style nonce="__NONCE__">
:root {
  color-scheme: light;
  --bg: #edf0f2;
  --surface: #ffffff;
  --sunken: #f4f6f8;
  --ink: #15202b;
  --ink-2: #4a5764;
  --muted: #66727e;
  --line: #d8dee4;
  --accent: #1d5fb0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --good-ink: #006300; --bad-ink: #a82828; --warn-ink: #7a5200;
  --none: #c9d1d8;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
}
:root[data-tema="dark"] {
  color-scheme: dark;
  --bg: #0f1317;
  --surface: #1b2128;
  --sunken: #151a20;
  --ink: #e8edf2;
  --ink-2: #b5c0cb;
  --muted: #92a0ad;
  --line: #2b343d;
  --accent: #6da7ec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good: #0ca30c; --warn: #fab219; --bad: #e0504f;
  --good-ink: #5fd35f; --bad-ink: #ff8a88; --warn-ink: #f2c25a;
  --none: #3a444e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="light"]) {
    color-scheme: dark;
    --bg: #0f1317; --surface: #1b2128; --sunken: #151a20; --ink: #e8edf2; --ink-2: #b5c0cb; --muted: #92a0ad;
    --line: #2b343d; --accent: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good: #0ca30c; --warn: #fab219; --bad: #e0504f;
    --good-ink: #5fd35f; --bad-ink: #ff8a88; --warn-ink: #f2c25a; --none: #3a444e;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

.b1 { background: var(--s1); } .b2 { background: var(--s2); } .b3 { background: var(--s3); } .b4 { background: var(--s4); }
.f-good { fill: var(--good); } .f-warn { fill: var(--warn); } .s-warn { stroke: var(--warn); } .f-bad { fill: var(--bad); }
rect.k-good, i.k-good { fill: var(--good); background: var(--good); } rect.k-warn, i.k-warn { fill: var(--warn); background: var(--warn); }
rect.k-bad, i.k-bad { fill: var(--bad); background: var(--bad); } rect.k-none, i.k-none { fill: var(--none); background: var(--none); }
.mt0 { margin-top: 0 !important; } .mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mb14 { margin-bottom: 14px; }
.tira .vl.peq { font-size: 20px; line-height: 1.6; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.acciones { display: flex; gap: 6px; align-items: center; }

/* ── estructura ── */
#app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
.riel { position: sticky; top: 0; align-self: start; height: 100vh; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); }
.marca { padding: 0 10px 18px; }
.marca strong { display: block; font-size: 16px; letter-spacing: -0.01em; }
.marca span { color: var(--muted); font-size: 13px; }
.riel nav { display: flex; flex-direction: column; gap: 2px; }
.pestana { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border: 0; background: none; text-align: left; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.pestana:hover { background: var(--sunken); }
.pestana[aria-current="page"] { background: var(--ink); color: var(--bg); }
.pestana .cuenta { font-size: 12px; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 99px; background: var(--bad); color: #fff; }
.pestana .cuenta.aviso { background: var(--warn); color: #3b2a00; }
.herramientas { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
.estado-act { font-size: 12.5px; color: var(--muted); padding: 0 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--ink-2); }
.btn.principal { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.suave { font-weight: 500; padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.girando .icono-act { animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
.interruptor { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 0 6px; }
.fila-mini { display: flex; gap: 6px; }
main { padding: 34px clamp(18px, 4vw, 48px) 80px; max-width: 1240px; width: 100%; }

/* ── héroe ── */
.heroe { padding-bottom: 26px; }
.heroe .estado { display: flex; align-items: center; gap: 18px; }
.heroe h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.04; letter-spacing: -0.03em; font-weight: 700; }
.insignia { flex: none; width: clamp(36px, 5vw, 54px); height: clamp(36px, 5vw, 54px); }
.heroe .hechos { margin-top: 14px; color: var(--ink-2); max-width: 70ch; }
.cinta { margin-top: 22px; }
.cinta svg { display: block; width: 100%; height: 34px; }
.cinta .pie { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.leyenda .it { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ── bloques ── */
section.bloque { margin-top: 34px; }
.bloque > header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.bloque h2 { font-size: 18px; letter-spacing: -0.01em; }
.ayuda { color: var(--muted); font-size: 13.5px; max-width: 78ch; }
.rejilla { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h3 { font-size: 15px; }
.panel .ayuda { margin-top: 2px; }
.tira { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tira > div { padding: 14px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.tira .et { color: var(--muted); font-size: 13px; }
.tira .vl { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
.tira .sb { color: var(--ink-2); font-size: 13px; }
dl.datos { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 18px; margin: 12px 0 0; }
dl.datos dt { color: var(--muted); }
dl.datos dd { margin: 0; overflow-wrap: anywhere; }

/* ── avisos ── */
.avisos { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.avisos .a { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.avisos .a:last-child { border-bottom: 0; }
.avisos b { font-weight: 650; }
.avisos .donde { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.avisos .d { color: var(--ink-2); font-size: 14px; }
.vacio { padding: 18px; color: var(--ink-2); }

/* ── gráficos ── */
.graf { margin: 0; }
.graf figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.graf .acciones { display: flex; gap: 6px; }
.graf .ahora { font-weight: 650; font-size: 22px; letter-spacing: -0.02em; }
.graf .lienzo { position: relative; margin-top: 8px; }
.graf svg { display: block; width: 100%; height: auto; overflow: visible; }
.graf .leyenda { margin-top: 8px; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.45; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.25); transform: translate(-50%, -100%); }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.ejes text { fill: var(--muted); font-size: 11.5px; font-family: var(--font); }
.rej { stroke: var(--line); stroke-width: 1; }
.cruz { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); } .l4 { stroke: var(--s4); }
.c1 { fill: var(--s1); } .c2 { fill: var(--s2); } .c3 { fill: var(--s3); } .c4 { fill: var(--s4); }
.seg { stroke: var(--surface); stroke-width: 2; }
.punto { stroke: var(--surface); stroke-width: 2; }
.publicados { display: grid; gap: 10px; margin-top: 12px; } .pub { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; }
.tabla-datos { max-height: 260px; overflow: auto; margin-top: 8px; }


/* ── reportes y perfiles ── */
.reportes { display: grid; gap: 10px; }
.reporte { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.reporte header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 6px; padding: 0; border: 0; }
.reporte .msg { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 6px; }
.reporte .meta { font-size: 12.5px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.reporte .nav { flex-basis: 100%; overflow-wrap: anywhere; }
.perfiles { display: grid; gap: 18px; }
.perfil { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.perfil > header { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin: 0 0 4px; padding: 0; border: 0; }
.perfil h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.perfil h4 { font-size: 14px; margin: 0 0 4px; }
.perfil .nota { text-align: right; flex: none; }
.perfil .nota .num { display: block; font-size: 30px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; }
.perfil .nota small { color: var(--muted); }
.perfil .prevision { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.perfil .prevision p { margin: 4px 0 0; color: var(--ink-2); }
.perfil .neg { color: var(--bad-ink); }
.psico { border-top: 1px dashed var(--line); padding-top: 14px; }
.psico h4 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.titular-psico { font-size: 17px; font-weight: 550; margin: 4px 0 6px; }
.matices { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.hipotesis { display: grid; gap: 10px; }
.hip { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.hip ul { margin: 6px 0 4px 18px; padding: 0; }
.aviso-psico { margin: 8px 0; padding: 8px 12px; border: 1px solid var(--warn); border-radius: 10px; color: var(--warn-ink); }
.lecturas { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); }
.aviso-privacidad { border-color: var(--warn); }
.aviso-privacidad p { margin: 6px 0; }

/* ── barras horizontales ── */
.hb { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; gap: 6px 12px; align-items: center; margin-top: 10px; font-size: 14px; }
.hb .et { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb svg { width: 100%; height: 10px; display: block; }
.pista { fill: var(--line); }
.hb .vl { text-align: right; min-width: 3ch; }
.medidor { margin-top: 12px; }
.medidor .cab { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.medidor svg { width: 100%; height: 10px; display: block; margin-top: 4px; }

/* ── tablas ── */
.tabla { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.nw { white-space: nowrap; }
.etiqueta { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.etiqueta.mal { border-color: var(--bad); color: var(--bad-ink); }
.etiqueta.bien { border-color: var(--good); color: var(--good-ink); }
.etiqueta.med { border-color: var(--warn); color: var(--warn-ink); }
.barra-filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.barra-filtros input, .barra-filtros select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.barra-filtros input { flex: 1 1 220px; }
pre.registro { margin: 0; max-height: 440px; overflow: auto; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
pre.registro .e { color: var(--bad-ink); } pre.registro .w { color: var(--warn-ink); }

/* ── acceso ── */
.entrada { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.entrada form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px; display: grid; gap: 14px; }
.entrada h1 { font-size: 24px; letter-spacing: -0.02em; }
.entrada input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.error { color: var(--bad-ink); min-height: 1.4em; font-size: 14px; }

@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .riel { position: static; height: auto; flex-direction: column; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 12px; }
  .riel nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .pestana { white-space: nowrap; }
  .herramientas { flex-direction: row; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  main { padding-top: 22px; }
  .rejilla { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .girando .icono-act { animation: none; } }
</style>
</head>
<body>
<div id="raiz"></div>
<script nonce="__NONCE__">
'use strict';
/* ───────────── utilidades ───────────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
class Raw { constructor(s) { this.s = s; } }
/* Todo lo que se interpola se escapa, salvo otro html`` ya construido. */
const html = (strings, ...vals) => {
  let out = '';
  strings.forEach((s, i) => {
    out += s;
    if (i < vals.length) {
      const v = vals[i];
      out += Array.isArray(v) ? v.map((x) => (x instanceof Raw ? x.s : esc(x))).join('') : v instanceof Raw ? v.s : esc(v);
    }
  });
  return new Raw(out);
};
const mount = (el, r) => { el.innerHTML = r instanceof Raw ? r.s : esc(r); };
const nf = new Intl.NumberFormat('es-ES');
const nf1 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
const fFecha = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const fHora = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });
const fDiaHora = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Berlin', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const fecha = (t) => (t ? fFecha.format(new Date(t)).replace(',', '') : '—');
const bytes = (n) => {
  if (n == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; let v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${nf1.format(v)} ${u[i]}`;
};
const pct = (v) => (v == null ? '—' : `${nf1.format(v)} %`);
const plural = (n, a, b) => `${nf.format(n)} ${n === 1 ? a : b}`;
function hace(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 1) return 'hace menos de un minuto';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 48) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} días`;
}
function duracion(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${plural(d, 'día', 'días')} y ${plural(h, 'hora', 'horas')}`;
  if (h) return `${plural(h, 'hora', 'horas')} y ${m} min`;
  return `${m} min`;
}
const sec = (o) => (o && !o.error ? o : null);
const nombreEstado = { ok: 'Todo en orden', aviso: 'Cosas que revisar', alerta: 'Urgente' };

/* Iconos de estado: forma + texto, nunca solo color. */
function icono(nivel, cls = '') {
  if (nivel === 'ok') return html`<svg class="${cls}" viewBox="0 0 24 24" role="img" aria-label="Correcto"><circle cx="12" cy="12" r="11" class="f-good"/><path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (nivel === 'aviso') return html`<svg class="${cls}" viewBox="0 0 24 24" role="img" aria-label="Aviso"><path d="M12 1.8 23 21H1z" class="f-warn s-warn" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5.5M12 17.4v.2" stroke="#3b2a00" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  return html`<svg class="${cls}" viewBox="0 0 24 24" role="img" aria-label="Urgente"><path d="M8 1.5h8L22.5 8v8L16 22.5H8L1.5 16V8z" class="f-bad"/><path d="M12 6.5v7M12 16.6v.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}

/* ───────────── estado ───────────── */
const S = { datos: null, vista: 'resumen', rango: 'h24', auto: true, cargando: false, error: null, ultimaCarga: 0, verTabla: new Set(), filtros: { usuarios: '', eventos: '', tipo: '', reportes: '', tipoReporte: '', limiteReportes: 30, registro: '', contenedor: '', soloErrores: false, limite: 150 } };
const specs = new Map();

const VISTAS = [
  ['resumen', 'Resumen'],
  ['servidor', 'Servidor'],
  ['base', 'Base de datos'],
  ['usuarios', 'Usuarios'],
  ['actividad', 'Actividad'],
  ['reportes', 'Reportes'],
  ['perfiles', 'Perfiles'],
  ['contenedores', 'Contenedores'],
  ['red', 'Red y copias'],
];

/* ───────────── red ───────────── */
async function pedir(url, opciones) {
  const r = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...opciones });
  let cuerpo = null;
  try { cuerpo = await r.json(); } catch { /* sin cuerpo */ }
  if (!r.ok) { const e = new Error(cuerpo?.error || `Error ${r.status}`); e.estado = r.status; throw e; }
  return cuerpo;
}

async function cargar(manual) {
  if (S.cargando) return;
  S.cargando = true; pintarHerramientas();
  try {
    S.datos = await pedir('/api/datos');
    S.error = null; S.ultimaCarga = Date.now();
    pintar();
  } catch (e) {
    if (e.estado === 401) { S.datos = null; pintarEntrada(''); }
    else { S.error = e.message; if (S.datos) pintar(); else pintarEntrada(e.message); }
  } finally {
    S.cargando = false; pintarHerramientas();
    if (manual) $('#actualizar')?.focus();
  }
}

/* ───────────── acceso ───────────── */
function pintarEntrada(msg) {
  mount($('#raiz'), html`<div class="entrada"><form id="f-entrada">
    <div><h1>Panel del servidor</h1><p class="ayuda">Solo para ti. Escribe la contraseña del panel.</p></div>
    <label><span class="sr">Contraseña</span><input id="clave" type="password" autocomplete="current-password" required placeholder="Contraseña" autofocus></label>
    <div class="error" role="alert" id="msg-error">${msg}</div>
    <button class="btn principal" type="submit">Entrar</button></form></div>`);
  $('#f-entrada').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const clave = $('#clave').value;
    $('#msg-error').textContent = '';
    try {
      await pedir('/api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clave }) });
      $('#raiz').innerHTML = '';
      armar(); await cargar(false);
    } catch (e) { $('#msg-error').textContent = e.message; $('#clave').select(); }
  });
}

/* ───────────── armazón ───────────── */
function armar() {
  mount($('#raiz'), html`<div id="app">
    <aside class="riel"><div class="marca"><strong>EConsultor</strong><span>Panel del servidor</span></div>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="herramientas" id="herramientas"></div></aside>
    <main id="principal" tabindex="-1" aria-live="polite"><p class="muted">Cargando datos…</p></main></div>`);
  pintarHerramientas();
  window.addEventListener('hashchange', () => { irA(location.hash.slice(1)); });
  irA(location.hash.slice(1) || 'resumen', true);
}

function irA(v, sinCargar) {
  if (!VISTAS.some(([k]) => k === v)) v = 'resumen';
  S.vista = v;
  if (location.hash.slice(1) !== v) history.replaceState(null, '', `#${v}`);
  pintarNav();
  if (S.datos && !sinCargar) pintar();
}

function pintarNav() {
  const nav = $('#nav'); if (!nav) return;
  const al = S.datos?.resumen.alertas ?? [];
  const cuenta = (donde) => {
    const f = al.filter((a) => donde.includes(a.donde));
    if (!f.length) return html``;
    return html`<span class="cuenta ${f.some((a) => a.nivel === 'alerta') ? '' : 'aviso'}" title="${plural(f.length, 'aviso', 'avisos')}">${f.length}</span>`;
  };
  const mapa = { servidor: ['Servidor'], base: ['Base de datos'], actividad: ['Seguridad'], reportes: ['Reportes'], perfiles: [], contenedores: ['Contenedores', 'La app'], red: ['Red', 'Copias'], resumen: [], usuarios: [] };
  mount(nav, html`${VISTAS.map(([k, t]) => html`<button class="pestana" data-v="${k}" ${k === S.vista ? raw('aria-current="page"') : ''}><span>${t}</span>${cuenta(mapa[k])}</button>`)}`);
  nav.querySelectorAll('.pestana').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.v; }));
}
const raw = (s) => new Raw(s);

function pintarHerramientas() {
  const h = $('#herramientas'); if (!h) return;
  const quien = S.datos?.conectadoComo;
  mount(h, html`<button class="btn principal ${S.cargando ? 'girando' : ''}" id="actualizar" ${S.cargando ? raw('disabled') : ''}>
      <svg class="icono-act" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      ${S.cargando ? 'Cargando…' : 'Actualizar'}</button>
    <label class="interruptor"><input type="checkbox" id="auto" ${S.auto ? raw('checked') : ''}> Cada 30 segundos</label>
    <div class="estado-act" id="estado-act" aria-live="off"></div>
    <div class="fila-mini"><button class="btn suave" id="tema">Tema</button><button class="btn suave" id="salir">Salir</button></div>
    ${quien ? html`<div class="estado-act">Conectado como ${quien}</div>` : ''}`);
  $('#actualizar').addEventListener('click', () => cargar(true));
  $('#auto').addEventListener('change', (e) => { S.auto = e.target.checked; });
  $('#tema').addEventListener('click', alternarTema);
  $('#salir').addEventListener('click', async () => { try { await pedir('/api/salir', { method: 'POST' }); } catch { /* da igual */ } S.datos = null; pintarEntrada(''); });

}
function tictac() {
  const el = $('#estado-act'); if (!el) return;
  el.textContent = S.error ? `Error: ${S.error}` : S.ultimaCarga ? `Actualizado ${hace(Date.now() - S.ultimaCarga).replace('hace menos de un minuto', 'hace unos segundos')}` : '';
}
function alternarTema() {
  const actual = document.documentElement.dataset.tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nuevo = actual === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.tema = nuevo;
  try { localStorage.setItem('panel-tema', nuevo); } catch { /* sin almacenamiento */ }
  dibujarTodos();
}

/* ───────────── gráficos ───────────── */
const cls = (i) => `${i + 1}`;
const bonito = (max) => {
  if (max <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(max))); const f = max / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
};

function grafico(id, spec) {
  specs.set(id, spec);
  return html`<figure class="graf" data-id="${id}">
    <figcaption><div><h3>${spec.titulo}</h3>${spec.ayuda ? html`<p class="ayuda">${spec.ayuda}</p>` : ''}</div>
      <div class="acciones">${spec.ahora != null ? html`<span class="ahora num">${spec.ahora}</span>` : ''}<button class="btn suave" data-tabla="${id}">Ver tabla</button></div></figcaption>
    <div class="leyenda" data-ley="${id}"></div>
    <div class="lienzo" data-lienzo="${id}"></div></figure>`;
}

function dibujarTodos() {
  document.querySelectorAll('[data-lienzo]').forEach((el) => dibujar(el.dataset.lienzo));
  document.querySelectorAll('[data-tabla]').forEach((b) => {
    b.onclick = () => { const id = b.dataset.tabla; S.verTabla.has(id) ? S.verTabla.delete(id) : S.verTabla.add(id); dibujar(id); };
  });
}

function dibujar(id) {
  const spec = specs.get(id); const lienzo = document.querySelector(`[data-lienzo="${id}"]`); const ley = document.querySelector(`[data-ley="${id}"]`);
  if (!spec || !lienzo) return;
  const btn = document.querySelector(`[data-tabla="${id}"]`);
  const tabla = S.verTabla.has(id);
  if (btn) btn.textContent = tabla ? 'Ver gráfico' : 'Ver tabla';
  const series = spec.series;
  if (ley) mount(ley, series.length > 1 ? html`${series.map((s, i) => html`<span class="it"><i class="b${cls(i)}"></i>${s.n}</span>`)}` : '');
  const hay = spec.tipo === 'linea' ? series.some((s) => s.pts.some((p) => p.y != null)) : spec.cats.length > 0;
  if (!hay) { mount(lienzo, html`<p class="vacio muted">Todavía no hay datos. El recolector guarda un punto cada minuto: vuelve en unos minutos.</p>`); return; }
  if (tabla) { mount(lienzo, tablaDe(spec)); return; }
  lienzo.innerHTML = '';
  (spec.tipo === 'linea' ? lineas : barras)(spec, lienzo);
}

function tablaDe(spec) {
  const filas = spec.tipo === 'linea'
    ? spec.series[0].pts.map((p, i) => ({ k: spec.fmtX(p.x), v: spec.series.map((s) => s.pts[i]?.y) }))
    : spec.cats.map((c, i) => ({ k: c, v: spec.series.map((s) => s.vals[i]) }));
  const fmt = spec.fmt || ((v) => nf1.format(v));
  return html`<div class="tabla tabla-datos"><table><thead><tr><th>${spec.tipo === 'linea' ? 'Momento' : (spec.col || 'Día')}</th>${spec.series.map((s) => html`<th class="r">${s.n}</th>`)}</tr></thead>
    <tbody>${filas.slice().reverse().map((f) => html`<tr><td class="nw">${f.k}</td>${f.v.map((v) => html`<td class="r num">${v == null ? '—' : fmt(v)}</td>`)}</tr>`)}</tbody></table></div>`;
}

const NS = 'http://www.w3.org/2000/svg';
function nodo(tag, attrs = {}, texto) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (texto != null) n.textContent = texto;
  return n;
}

function marco(spec, lienzo, ymax) {
  const W = Math.max(280, lienzo.clientWidth || 640); const H = 200;
  const m = { l: 46, r: 12, t: 10, b: 24 };
  const svg = nodo('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.titulo });
  const g = nodo('g', { class: 'ejes' });
  const yv = (v) => m.t + (1 - v / ymax) * (H - m.t - m.b);
  for (let i = 0; i <= 4; i++) {
    const v = (ymax * i) / 4; const y = yv(v);
    g.append(nodo('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, class: 'rej' }));
    g.append(nodo('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, (spec.fmtY || nf1.format)(v)));
  }
  svg.append(g);
  lienzo.append(svg);
  return { svg, g, W, H, m, yv };
}

function lineas(spec, lienzo) {
  const todos = spec.series.flatMap((s) => s.pts.filter((p) => p.y != null));
  const max = spec.max ?? bonito(Math.max(1e-9, ...todos.map((p) => p.y)) * 1.1);
  const { svg, g, W, H, m, yv } = marco(spec, lienzo, max);
  const xs = spec.series[0].pts.map((p) => p.x);
  const x0 = xs[0], x1 = xs[xs.length - 1] || x0 + 1;
  const xv = (x) => m.l + ((x - x0) / Math.max(1, x1 - x0)) * (W - m.l - m.r);
  for (let i = 0; i <= 4; i++) { const x = x0 + ((x1 - x0) * i) / 4; g.append(nodo('text', { x: xv(x), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, spec.fmtX(x))); }
  spec.series.forEach((s, si) => {
    let d = ''; let abierto = false;
    s.pts.forEach((p) => { if (p.y == null) { abierto = false; return; } d += `${abierto ? 'L' : 'M'}${xv(p.x).toFixed(1)},${yv(Math.min(p.y, max)).toFixed(1)}`; abierto = true; });
    svg.append(nodo('path', { d, class: `ln l${cls(si)}` }));
  });
  const cruz = nodo('line', { y1: m.t, y2: H - m.b, class: 'cruz', visibility: 'hidden' });
  const puntos = spec.series.map((_, si) => nodo('circle', { r: 4, class: `punto c${cls(si)}`, visibility: 'hidden' }));
  svg.append(cruz, ...puntos);
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; lienzo.append(tip);
  const capa = nodo('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' });
  svg.append(capa);
  const mover = (ev) => {
    const r = svg.getBoundingClientRect(); const px = ((ev.clientX - r.left) / r.width) * W;
    let mejor = 0, dist = Infinity;
    xs.forEach((x, i) => { const dd = Math.abs(xv(x) - px); if (dd < dist) { dist = dd; mejor = i; } });
    const x = xv(xs[mejor]);
    cruz.setAttribute('x1', x); cruz.setAttribute('x2', x); cruz.setAttribute('visibility', 'visible');
    const fmt = spec.fmt || ((v) => nf1.format(v));
    let filas = '';
    spec.series.forEach((s, si) => {
      const p = s.pts[mejor];
      if (p && p.y != null) { puntos[si].setAttribute('cx', x); puntos[si].setAttribute('cy', yv(Math.min(p.y, max))); puntos[si].setAttribute('visibility', 'visible'); } else puntos[si].setAttribute('visibility', 'hidden');
      filas += `<div><span class="sw b${cls(si)}"></span>${spec.series.length > 1 ? esc(s.n) + ': ' : ''}<b class="num">${p && p.y != null ? esc(fmt(p.y)) : 'sin dato'}</b></div>`;
    });
    tip.innerHTML = `<div>${esc(spec.fmtX(xs[mejor], true))}</div>${filas}`;
    tip.hidden = false;
    const ancho = lienzo.clientWidth; const pxPantalla = (x / W) * r.width;
    tip.style.left = `${Math.min(Math.max(pxPantalla, 60), ancho - 60)}px`; tip.style.top = `${Math.max(40, (yv(spec.series[0].pts[mejor]?.y ?? 0) / H) * r.height) - 6}px`;
  };
  const salir = () => { tip.hidden = true; cruz.setAttribute('visibility', 'hidden'); puntos.forEach((p) => p.setAttribute('visibility', 'hidden')); };
  capa.addEventListener('pointermove', mover); capa.addEventListener('pointerleave', salir); capa.addEventListener('pointerdown', mover);
}

function barras(spec, lienzo) {
  const totales = spec.cats.map((_, i) => spec.series.reduce((a, s) => a + (s.vals[i] || 0), 0));
  const m4 = Math.max(4, ...totales); const max = Math.ceil(m4 / 4) * 4;
  const { svg, g, W, H, m, yv } = marco({ ...spec, fmtY: (v) => nf.format(Math.round(v)) }, lienzo, max);
  const n = spec.cats.length; const ancho = (W - m.l - m.r) / n; const bw = Math.max(3, ancho - 4);
  spec.cats.forEach((c, i) => {
    let acum = 0; const x = m.l + i * ancho + (ancho - bw) / 2;
    spec.series.forEach((s, si) => {
      const v = s.vals[i] || 0; if (!v) return;
      const y1 = yv(acum + v), y0 = yv(acum); acum += v;
      svg.append(nodo('rect', { x, y: y1, width: bw, height: Math.max(0, y0 - y1), class: `seg c${cls(si)}`, rx: 2 }));
    });
    if (i % Math.ceil(n / 6) === 0) g.append(nodo('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle' }, c.slice(5)));
  });
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; lienzo.append(tip);
  const capa = nodo('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' }); svg.append(capa);
  const mover = (ev) => {
    const r = svg.getBoundingClientRect(); const px = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.min(n - 1, Math.max(0, Math.floor((px - m.l) / ancho)));
    const filas = spec.series.map((s, si) => `<div><span class="sw b${cls(si)}"></span>${esc(s.n)}: <b class="num">${nf.format(s.vals[i] || 0)}</b></div>`).join('');
    tip.innerHTML = `<div>${esc(spec.cats[i])}</div>${filas}`; tip.hidden = false;
    const cx = ((m.l + i * ancho + ancho / 2) / W) * r.width;
    tip.style.left = `${Math.min(Math.max(cx, 70), lienzo.clientWidth - 70)}px`; tip.style.top = `${Math.max(46, (yv(totales[i]) / H) * r.height - 6)}px`;
  };
  capa.addEventListener('pointermove', mover); capa.addEventListener('pointerleave', () => { tip.hidden = true; }); capa.addEventListener('pointerdown', mover);
}

/* Barras horizontales (una sola serie, un solo tono) */
function hbarras(filas, fmt = nf.format) {
  const max = Math.max(1, ...filas.map((f) => f.v));
  return html`<div class="hb">${filas.map((f) => html`<span class="et" title="${f.l}">${f.l}</span>
    <svg viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="${f.l}: ${fmt(f.v)}"><rect class="pista" width="100" height="10" rx="3"/><rect class="c1" width="${Math.max(f.v ? 1.5 : 0, (f.v / max) * 100)}" height="10" rx="3"/></svg>
    <span class="vl num">${fmt(f.v)}</span>`)}</div>`;
}
function medidor(etq, valor, texto, umbralAviso = 80, umbralMal = 90) {
  const nivel = valor >= umbralMal ? 'alerta' : valor >= umbralAviso ? 'aviso' : 'ok';
  return html`<div class="medidor"><div class="cab"><span>${etq}</span><span class="num"><b>${texto}</b> ${nivel !== 'ok' ? html`<span class="etiqueta ${nivel === 'alerta' ? 'mal' : 'med'}">${nivel === 'alerta' ? 'Muy alto' : 'Alto'}</span>` : ''}</span></div>
    <svg viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="${etq}: ${texto}"><rect class="pista" width="100" height="10" rx="3"/><rect class="c1" width="${Math.max(1, Math.min(100, valor))}" height="10" rx="3"/></svg></div>`;
}

/* ───────────── vistas ───────────── */
const cabecera = (t, ayuda) => html`<header><h2>${t}</h2>${ayuda ? html`<p class="ayuda">${ayuda}</p>` : ''}</header>`;
const sinDatos = (p, nombre) => html`<p class="vacio muted">${p?.error ? `No se pudo leer «${nombre}»: ${p.error}` : `Sin datos de «${nombre}» todavía.`}</p>`;

function cinta(d) {
  const h24 = d.historial.h24; const ahora = d.generadoEn; const paso = 10 * 60000; const n = 144;
  const inicio = Math.floor(ahora / paso) * paso - (n - 1) * paso;
  const mapa = new Map(h24.map((p) => [p.t, p.app]));
  let ok = 0, medidos = 0;
  const celdas = [];
  for (let i = 0; i < n; i++) {
    const t = inicio + i * paso; const v = mapa.get(t);
    let clase = 'k-none', et = 'sin datos';
    if (v != null) { medidos++; if (v >= 0.99) { clase = 'k-good'; et = 'respondió'; ok++; } else if (v > 0) { clase = 'k-warn'; et = 'con fallos'; ok += v; } else { clase = 'k-bad'; et = 'no respondió'; } }
    celdas.push({ t, clase, et });
  }
  const w = 1000 / n;
  const svg = html`<svg viewBox="0 0 1000 34" preserveAspectRatio="none" role="img" aria-label="Disponibilidad de la app en las últimas 24 horas">${celdas.map((c, i) => html`<rect x="${(i * w).toFixed(2)}" y="0" width="${(w - 1).toFixed(2)}" height="34" rx="2" class="${c.clase}" data-t="${c.t}" data-e="${c.et}"/>`)}</svg>`;
  const disp = medidos ? `${nf1.format((ok / medidos) * 100)} % del tiempo medido` : 'sin mediciones todavía';
  return html`<div class="cinta" id="cinta">${svg}<div class="pie"><span>Hace 24 h</span><span>La app respondió: <b class="num">${disp}</b></span><span>Ahora</span></div>
    <div class="leyenda mt6"><span class="it"><i class="k-good"></i>Respondió</span><span class="it"><i class="k-warn"></i>Con fallos</span><span class="it"><i class="k-bad"></i>No respondió</span><span class="it"><i class="k-none"></i>Sin datos</span></div></div>`;
}

function vResumen(d) {
  const r = d.resumen; const host = d.host; const b = sec(d.base);
  const sist = sec(host?.sistema); const mem = sec(host?.memoria);
  const raiz = Array.isArray(host?.discos) ? host.discos.find((x) => x.montaje === '/') : null;
  const cop = sec(host?.lento?.copias)?.instantaneas?.[0];
  const hechos = [sist ? `Servidor encendido desde hace ${duracion(sist.encendido_s)}` : null, d.hostAntiguedadS != null ? `datos del servidor de hace ${d.hostAntiguedadS < 90 ? `${d.hostAntiguedadS} s` : `${Math.round(d.hostAntiguedadS / 60)} min`}` : null].filter(Boolean).join(' · ');
  return html`<div class="heroe"><div class="estado">${icono(r.nivel, 'insignia')}<h1>${r.frase}</h1></div>

      ${r.alertas.length ? html`<div class="avisos">${r.alertas.map((a) => html`<div class="a">${icono(a.nivel)}<div><b>${a.titulo}</b><div class="d">${a.detalle}</div></div><span class="donde">${a.donde}</span></div>`)}</div>` : html`<div class="avisos"><div class="vacio">${icono('ok')} Nada que hacer ahora mismo.</div></div>`}</section>
    <section class="bloque">${cabecera('De un vistazo')}
      <div class="tira">
        <div><div class="et">Cuentas</div><div class="vl num">${b ? nf.format(b.cuentas) : '—'}</div><div class="sb">${b ? `${b.depago} de pago · ${b.conDosPasos} con 2FA` : ''}</div></div>
        <div><div class="et">Movimientos</div><div class="vl num">${b ? nf.format(b.movimientos) : '—'}</div><div class="sb">${d.movimientos?.hoy != null ? `${d.movimientos.hoy} añadidos hoy` : ''}</div></div>
        <div><div class="et">Sesiones abiertas</div><div class="vl num">${b ? nf.format(b.sesionesActivas) : '—'}</div><div class="sb">con sesión iniciada</div></div>
        <div><div class="et">Disco</div><div class="vl num">${raiz ? `${raiz.pct} %` : '—'}</div><div class="sb">${raiz ? `${bytes(raiz.usado)} de ${bytes(raiz.total)}` : ''}</div></div>
        <div><div class="et">Memoria</div><div class="vl num">${mem ? `${Math.round(mem.usada_pct)} %` : '—'}</div><div class="sb">${mem ? `${bytes(mem.total - mem.disponible)} de ${bytes(mem.total)}` : ''}</div></div>
        <div><div class="et">Última copia</div><div class="vl num">${cop ? hace(d.generadoEn - Date.parse(cop.fecha)).replace('hace ', '') : '—'}</div><div class="sb">${cop ? fecha(cop.fecha) : 'sin copias todavía'}</div></div>
      </div></section>
    <section class="bloque">${cabecera('Últimos eventos', 'Lo último que ha pasado en la app: entradas, altas, importaciones y avisos de seguridad.')}
      ${tablaEventos(d.actividad?.eventos?.slice(0, 8) ?? [])}</section>`;
}

function etiquetaEvento(e) {
  const mal = ['login_failed', 'mfa_failed', 'refresh_reuse_detected', 'recovery_code_used', 'mfa_disabled'].includes(e.tipo);
  return html`<span class="etiqueta ${mal ? 'mal' : ''}">${e.etiqueta}</span>`;

function tablaEventos(lista) {

  if (!ps.disponible) return html`<div class="psico mt14"><h4>Evaluación psico-económica</h4><p class="muted">${ps.motivo}</p></div>`;
  const nivelCls = { bajo: 'bien', medio: 'med', alto: 'mal' };
  const lista = (t, xs) => xs && xs.length ? html`<h4 class="mt10">${t}</h4><ul class="lecturas">${xs.map((x) => html`<li>${x}</li>`)}</ul>` : '';
  const tit = ps.titular;
  const rt = ps.ritmo;
  const DIAS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  return html`<div class="psico mt14"><h4>Evaluación psico-económica <span class="etiqueta med">${tit.nombre}</span></h4>
    <p class="titular-psico">${tit.frase}</p>
    ${tit.matices.length ? html`<p class="matices">${tit.matices.map((m) => html`<span class="etiqueta">${m}</span> `)}</p>` : ''}
    <p class="muted">${ps.base.movimientos} movimientos · ${plural(ps.base.meses, 'mes', 'meses')} de datos. Guion dominante: ${ps.guion.nombre.toLowerCase()}. Es una lectura de conducta, no un diagnóstico.</p>
    ${ps.restriccion ? html`<p class="aviso-psico"><b>Cuidado:</b> casi todo su gasto es obligado. Lo que se ve es sobre todo restricción, no carácter.</p>` : ''}
    ${lista('Retrato', ps.retrato)}
    ${lista('Cómo evoluciona', ps.evolucion)}
    ${ps.cronologia.length >= 3 ? html`<div class="rejilla mt10"><div>${grafico(`psico-ahorro-${id}`, { tipo: 'barras', titulo: 'Ahorro efectivo por mes (%)', col: 'Mes', fmt: (v) => `${v} %`, series: [{ n: 'Ahorro', vals: ps.cronologia.map((c) => c.ahorroPct ?? 0) }], cats: ps.cronologia.map((c) => c.mes) })}</div>
      <div>${grafico(`psico-disc-${id}`, { tipo: 'barras', titulo: 'Peso del gasto discrecional por mes (%)', col: 'Mes', fmt: (v) => `${v} %`, series: [{ n: 'Discrecional', vals: ps.cronologia.map((c) => c.discrecionalPct) }], cats: ps.cronologia.map((c) => c.mes) })}</div></div>` : ''}
    <div class="rejilla mt10">
      <div><h4>Ritmo semanal (gasto cotidiano)</h4>${hbarras(rt.semana.map((v, i) => ({ l: ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'][i], v })), (v) => `${v} %`)}</div>
      <div><h4>Ritmo del ciclo de cobro</h4>${rt.tercios ? html`<p class="muted">Cobra hacia el día ${rt.diaCobro}${rt.efectoCobro != null ? ` · primera semana: ×${rt.efectoCobro} lo esperable en ocio` : ''}.</p>${hbarras([{ l: 'Primeros 10 días', v: rt.tercios[0] }, { l: 'Días 11 a 20', v: rt.tercios[1] }, { l: 'Final del ciclo', v: rt.tercios[2] }], (v) => `${v} %`)}` : html`<p class="muted">Aún no hay datos suficientes para ver el ritmo del ciclo.</p>`}</div></div>
    ${lista('Qué revela su dinero', ps.revela)}
    ${lista('Puntos ciegos', ps.puntosCiegos)}
    ${lista('Contradicciones', ps.tensiones)}
    ${ps.hipotesis.length ? html`<h4 class="mt10">Hipótesis (no certezas)</h4><div class="hipotesis">${ps.hipotesis.map((h) => html`<div class="hip"><b>${h.observacion}</b><ul>${h.explicaciones.map((x) => html`<li>${x}</li>`)}</ul><p class="muted">Para distinguirlo: ${h.paraDistinguir}</p></div>`)}</div>` : ''}
    ${ps.palancas.length ? html`<h4 class="mt10">Dónde está el dinero que se escapa (al año)</h4><div class="tabla"><table><thead><tr><th>Palanca</th><th class="r">Importe</th><th>Qué hacer</th></tr></thead><tbody>${ps.palancas.map((x) => html`<tr><td>${x.nombre}</td><td class="r num">${dinero(x.anualMinor, moneda)}</td><td class="muted">${x.detalle}</td></tr>`)}</tbody></table></div>` : ''}
    ${lista('Sin filtro', ps.sinFiltro)}
    ${lista('Para hablarlo con la persona', ps.preguntas)}
    <h4 class="mt10">Rasgos medidos</h4>
    <div class="tabla"><table><thead><tr><th>Rasgo</th><th>Nivel</th><th class="r">Puntos</th><th>Confianza</th><th>Evidencia</th></tr></thead><tbody>${ps.rasgos.map((r) => html`<tr><td><b>${r.nombre}</b><br><span class="muted">${r.marco}</span><br><span class="muted">${r.lectura}</span></td><td><span class="etiqueta ${nivelCls[r.nivel]}">${r.nivel}</span></td><td class="r num">${r.puntos}</td><td>${r.confianza}</td><td class="muted">${r.evidencia.join(' · ')}</td></tr>`)}</tbody></table></div>
    <h4 class="mt10">En qué nivel se gasta el dinero (Maslow)</h4>${hbarras(ps.necesidades.reparto.map((x) => ({ l: x.nivel, v: x.pct })), (v) => `${v} %`)}
    <details class="mt10"><summary>Límites de esta lectura</summary><ul class="lecturas">${ps.limites.map((x) => html`<li>${x}</li>`)}</ul></details></div>`;
}

    ${git ? html`<section class="bloque">${cabecera('Versión instalada y actualizaciones automáticas', 'El servidor mira GitHub cada 10 minutos y se actualiza solo.')}
      <div class="panel"><dl class="datos mt0"><dt>Versión</dt><dd class="mono">${git.commit} · ${git.asunto}</dd><dt>Fecha</dt><dd class="num">${fecha(git.fecha)}</dd><dt>Rama</dt><dd>${git.rama}</dd><dt>Pendientes de bajar</dt><dd>${git.detras ?? '—'}</dd><dt>Cambios locales</dt><dd>${git.cambios_locales ? html`<span class="etiqueta med">${git.cambios_locales}</span>` : 'Ninguno'}</dd></dl>

}

/* ───────────── pintado ───────────── */
const RENDER = { resumen: vResumen, servidor: vServidor, base: vBase, usuarios: vUsuarios, actividad: vActividad, reportes: vReportes, perfiles: vPerfiles, contenedores: vContenedores, red: vRed };
function pintar() {
  if (!S.datos) return;
  specs.clear();
  pintarNav();
  const principal = $('#principal'); if (!principal) return;
  const y = window.scrollY;
  mount(principal, RENDER[S.vista](S.datos));
  conectar();
  dibujarTodos();
  window.scrollTo(0, y);
  if (S.error) principal.insertAdjacentHTML('afterbegin', `<p class="error" role="alert">No se pudo actualizar: ${esc(S.error)}. Se muestran los últimos datos.</p>`);
  activarCinta();
}
function conectar() {
  document.querySelectorAll('[data-rango]').forEach((b) => b.addEventListener('click', () => { S.rango = b.dataset.rango; pintar(); }));
  const f = (id, fn) => { const el = $(id); if (el) el.addEventListener('input', fn); };
  f('#f-usuarios', (e) => { S.filtros.usuarios = e.target.value; repintarTabla('#f-usuarios'); });
  f('#f-eventos', (e) => { S.filtros.eventos = e.target.value; S.filtros.limite = 150; repintarTabla('#f-eventos'); });
  $('#f-tipo')?.addEventListener('change', (e) => { S.filtros.tipo = e.target.value; S.filtros.limite = 150; pintar(); });
  $('#mas-eventos')?.addEventListener('click', () => { S.filtros.limite += 150; pintar(); });
  $('#f-cont')?.addEventListener('change', (e) => { S.filtros.contenedor = e.target.value; pintar(); });
  f('#f-reg', (e) => { S.filtros.registro = e.target.value; repintarTabla('#f-reg'); });
  f('#f-reportes', (e) => { S.filtros.reportes = e.target.value; S.filtros.limiteReportes = 30; repintarTabla('#f-reportes'); });
  $('#f-tipo-rep')?.addEventListener('change', (e) => { S.filtros.tipoReporte = e.target.value; S.filtros.limiteReportes = 30; pintar(); });
  $('#mas-reportes')?.addEventListener('click', () => { S.filtros.limiteReportes += 30; pintar(); });
  $('#f-err')?.addEventListener('change', (e) => { S.filtros.soloErrores = e.target.checked; pintar(); });
}
/* Al escribir en un buscador se repinta sin perder el foco ni la posición del cursor. */
function repintarTabla(selector) {
  const pos = $(selector).selectionStart;
  pintar();
  const el = $(selector); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
}
function activarCinta() {
  const c = $('#cinta'); if (!c) return;
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; c.style.position = 'relative'; c.append(tip);
  c.querySelectorAll('rect').forEach((r) => {
    const mostrar = () => { const cr = c.getBoundingClientRect(); const rr = r.getBoundingClientRect(); tip.textContent = `${fFecha.format(new Date(Number(r.dataset.t))).replace(',', '')} · ${r.dataset.e}`; tip.hidden = false; tip.style.left = `${Math.min(Math.max(rr.left - cr.left + rr.width / 2, 90), cr.width - 90)}px`; tip.style.top = '-4px'; };
    r.addEventListener('pointerenter', mostrar); r.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}

/* ───────────── arranque ───────────── */
try { const t = localStorage.getItem('panel-tema'); if (t) document.documentElement.dataset.tema = t; } catch { /* sin almacenamiento */ }
let temporizador;
(async function iniciar() {
  try {
    S.datos = await pedir('/api/datos'); S.ultimaCarga = Date.now();
    armar(); pintar();
  } catch (e) {
    if (e.estado === 401) pintarEntrada(''); else pintarEntrada(e.message);
  }
  setInterval(tictac, 5000);
  temporizador = setInterval(() => { if (S.auto && S.datos && !document.hidden && Date.now() - S.ultimaCarga > 29000) cargar(false); }, 5000);
  let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => S.datos && dibujarTodos(), 150); }).observe(document.body);
})();
</script>
