name: Android

# Compila la app de Android (un APK que abre tu EConsultor) y lo publica en una release fija.
# Se lanza sola al cambiar apps/android/** o a mano desde la pestaña Actions › Android › Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Clave de firma propia (opcional)
        # Si defines los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
        # ANDROID_KEY_PASSWORD se usan en vez de la clave de instalación personal incluida en el repositorio.
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        working-directory: apps/android
        run: >
          gradle --no-daemon assembleRelease
          -PserverUrl="${{ vars.EC_SERVER_URL || 'https://hub.fable-denebola.ts.net' }}"
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Preparar el archivo
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/econsultor.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: econsultor-apk
          path: dist/econsultor.apk

      - name: Publicar en la release «android-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest dist/econsultor.apk \
            --title "App de Android (build ${{ github.run_number }})" \
            --notes "Descarga econsultor.apk en el teléfono y ábrelo para instalar. Compilado desde ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
