# docker compose up -d                      → solo la app en http://127.0.0.1:8787 (úsala tras Cloudflare Tunnel / Tailscale)
# docker compose --profile caddy up -d      → además Caddy con HTTPS automático (necesita dominio y puertos 80/443)
#
# Requiere un archivo .env en esta carpeta con, como mínimo:
#   ACCESS_TOKEN_SECRET, DATA_ENCRYPTION_KEY  (npm run gen:keys)  y  PUBLIC_ORIGIN=https://tu-dominio
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - econ-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Panel personal de administración (solo lectura). Se activa con: bash scripts/servidor.sh panel
  # Escucha solo en 127.0.0.1 y se publica ÚNICAMENTE con `tailscale serve` (nunca con Funnel).
  panel:
    profiles: ["panel"]
    build: .
    command: ["node", "dist/panel.js"]
    restart: unless-stopped
    # Solo recibe lo que necesita: la clave para leer la base de datos y su propia contraseña.
    env_file:
      - path: .env.panel
        required: false
    environment:
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_FILE: /data/store.json
      # Para cambiar el plan de una cuenta el panel se lo pide a la app (ADMIN_TOKEN está en .env.panel).
      APP_URL: http://app:8787
      PREMIUM_FOR_ALL: ${PREMIUM_FOR_ALL:-false}
      HOST_STATE: /estado/host.json
      HOST_HISTORY: /estado/historial.jsonl
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - econ-data:/data:ro
      - ./estado:/estado:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  econ-data:
  caddy_data:
  caddy_config:
